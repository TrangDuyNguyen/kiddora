name: kiddora
description: "Kiddora - Kids Learning & Live Classes Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  auto_route: ^9.2.2

  # UI & Styling
  google_fonts: ^6.2.1
  fl_chart: ^0.70.2
  cached_network_image: ^3.4.1
  lottie: ^3.3.1
  flutter_native_splash: ^2.4.5

  # Utilities & Modeling
  intl: ^0.19.0
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  shared_preferences: ^2.5.3

  # Networking & Secure Session Storage
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  auto_route_generator: ^9.0.0
  riverpod_generator: ^2.6.3
  freezed: ^3.0.2
  json_serializable: ^6.9.4
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon_source.jpg"
  min_sdk_android: 21
  adaptive_icon_background: "#4648D4"
  adaptive_icon_foreground: "assets/images/app_icon_source.jpg"
  web:
    generate: false

flutter_native_splash:
  color: "#4648D4"
  image: assets/images/app_icon_source.jpg
  color_dark: "#2B2D9E"
  image_dark: assets/images/app_icon_source.jpg
  android: true
  ios: true
  android_12:
    image: assets/images/app_icon_source.jpg
    icon_background_color: "#4648D4"
    image_dark: assets/images/app_icon_source.jpg
    icon_background_color_dark: "#2B2D9E"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/fonts/

  fonts:
    - family: Quicksand
      fonts:
        - asset: assets/fonts/Quicksand-Regular.ttf
          weight: 400
        - asset: assets/fonts/Quicksand-Medium.ttf
          weight: 500
        - asset: assets/fonts/Quicksand-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Quicksand-Bold.ttf
          weight: 700
