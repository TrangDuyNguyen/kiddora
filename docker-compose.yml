# ================================================================
# Kiddora — Professional Self-Hosted Backend Stack
# Khởi động: docker compose up -d
# Dừng:      docker compose down
# ================================================================

services:

  # ── FastAPI Backend ─────────────────────────────────────────
  api:
    build: ./backend
    container_name: kiddora-api
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8000
    restart: unless-stopped

  # ── Celery Worker (Background: grade quiz, award badge) ─────
  worker:
    build: ./backend
    container_name: kiddora-worker
    env_file:
      - ./backend/.env
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app
    command: celery -A app.workers.celery_app worker --loglevel=info
    restart: unless-stopped

  # ── PostgreSQL 16 ───────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: kiddora-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: kiddora
      POSTGRES_USER: kiddora
      POSTGRES_PASSWORD: kiddora_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kiddora"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Redis 7 ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: kiddora-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── MinIO (S3-compatible File Storage) ──────────────────────
  minio:
    image: elestio/minio:latest
    container_name: kiddora-minio
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Admin Console → http://localhost:9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

  # ── LiveKit (WebRTC Video Server) ───────────────────────────
  livekit:
    image: livekit/livekit-server:latest
    container_name: kiddora-livekit
    ports:
      - "7880:7880"       # HTTP/WS API
      - "7881:7881"       # RTC TCP
      - "7882:7882/udp"   # RTC UDP
    environment:
      LIVEKIT_KEYS: "devkey: devsecret"
    command: --dev --bind 0.0.0.0
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:

# ================================================================
# URLs sau khi chạy docker compose up -d:
#
#   FastAPI Docs  → http://localhost:8000/docs
#   MinIO Console → http://localhost:9001  (minioadmin / minioadmin123)
#   PostgreSQL    → localhost:5432  (kiddora / kiddora_secret)
#   Redis         → localhost:6379
#   LiveKit       → localhost:7880
# ================================================================
